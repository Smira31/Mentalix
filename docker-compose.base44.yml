services:
  web:
    image: node:22-slim
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-ec", "CI=true npm ci --ignore-scripts && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    environment:
      - NODE_ENV=development
      - VITE_TG_SHELL=1
      - VITE_LOCAL_PREVIEW=true
      # Sandbox-only включение фронтенд-флага Mentalix Pro для проверки превью.
      # Production-сборка флаг не получает: default — выключено (src/lib/proFlag.js).
      - VITE_PRO_REVIEW_PLAN_ENABLED=true
      # Sandbox-only включение фронтенд-флага интерфейса оплаты.
      # Production-сборка флаг не получает: default — выключен (src/lib/paymentConfig.js).
      - VITE_PAYMENT_UI_ENABLED=true
      # Sandbox-only повтор продакшн-конфигурации (.github/workflows/firebase-hosting.yml):
      # вход по email выключен (нет своего домена в Resend), поэтому экран гостя
      # в превью ведёт в Telegram Login — то же состояние, что видят люди в бою.
      # Production-сборка эти значения задаёт сама; дефолт фронтенда — email включён.
      - VITE_EMAIL_LOGIN_ENABLED=false
      # Публичное имя бота для Telegram Login (не секрет), как в прод-сборке.
      - VITE_TELEGRAM_BOT_USERNAME=Mentalix_club_bot
      # Sandbox-only сценарий dev-mock Pro без параметра URL: оболочка превью
      # подменяет адрес своими служебными параметрами, поэтому `?proMock=…`
      # из ссылки до приложения не доходит. URL-параметр приоритетен.
      # Production-сборка переменную не получает: default — mock выключен.
      - VITE_PRO_MOCK=ready
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
