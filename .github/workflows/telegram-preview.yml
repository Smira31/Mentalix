name: Telegram Preview

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      url:
        description: 'Vercel Preview URL to verify and notify'
        required: true
        type: string
      branch:
        description: 'Branch name shown in Telegram'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: telegram-preview-${{ github.event.client_payload.gitCommitSha || inputs.url || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    name: Verify Vercel preview and notify Telegram
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.action == 'vercel.deployment.success' && github.event.client_payload.environment == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_MAIN_BOT_TOKEN }}
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      PREVIEW_URL: ${{ github.event.client_payload.url || inputs.url }}
      PREVIEW_ENVIRONMENT: ${{ github.event.client_payload.environment || 'preview' }}
      PREVIEW_BRANCH: ${{ github.event.client_payload.gitBranch || inputs.branch || 'unknown' }}
      PREVIEW_SHA: ${{ github.event.client_payload.gitCommitSha || github.sha }}
      PR_NUMBER: ${{ github.event.client_payload.gitPullRequestId || 'n/a' }}

    steps:
      - name: Validate Vercel preview payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PREVIEW_ENVIRONMENT" != "preview" ]; then
            echo "Ignoring non-preview deployment: $PREVIEW_ENVIRONMENT"
            exit 1
          fi
          case "$PREVIEW_URL" in
            https://*.vercel.app|https://*.vercel.sh) ;;
            *) echo "Unexpected Preview URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac

      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            echo 'VERCEL_PROTECTION_BYPASS secret is missing — health check would hit the Vercel SSO wall instead of the app.' >&2
            exit 1
          fi
          # Project has Vercel Deployment Protection (SSO) on all
          # *.vercel.app preview URLs — an unauthenticated request 302s to
          # vercel.com/sso-api instead of reaching the app. The project
          # already has a "Protection Bypass for Automation" secret
          # configured; send it as a header so this check (and any other
          # automated caller) reaches the real response instead of the SSO
          # wall. Confirmed live: same URL returns the SSO redirect without
          # this header and {"status":"ok"} with it.
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused --max-time 20 \
            --header "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            "$PREVIEW_URL/api/health")"
          printf '%s\n' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Resolve PR number
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # client_payload.gitPullRequestId from Vercel's repository_dispatch is
          # not populated in practice (confirmed on real vercel.deployment.success
          # events, not just workflow_dispatch) — resolve independently from the
          # branch name instead, which does arrive correctly.
          resolved="$PR_NUMBER"
          if [ "$resolved" = "n/a" ] && [ -n "$PREVIEW_BRANCH" ] && [ "$PREVIEW_BRANCH" != "unknown" ] && [ "$PREVIEW_BRANCH" != "main" ]; then
            found="$(gh pr list --repo "${{ github.repository }}" --head "$PREVIEW_BRANCH" --state open --json number --jq '.[0].number // empty' || true)"
            if [ -n "$found" ]; then
              resolved="$found"
            fi
          fi
          echo "number=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved PR number: $resolved (client_payload had: $PR_NUMBER, branch: $PREVIEW_BRANCH)"

      - name: Resolve preview checklist from PR body
        id: checklist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Explicit, documented format (docs/TELEGRAM_PREVIEW_ACTIONS.md):
          # the PR body must have a "## Preview checklist" section; its
          # content becomes the Telegram scenario text. Deliberately not a
          # file-changed heuristic and not a separate manual parameter per
          # dispatch — the checklist is authored once, git-tracked in the
          # PR itself, and reused for every automatic notification.
          pr_number="${{ steps.pr.outputs.number }}"
          text=""
          if [ "$pr_number" != "n/a" ]; then
            body="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json body --jq '.body // ""' | tr -d '\r')"
            text="$(printf '%s\n' "$body" | awk '
              /^## Preview checklist[[:space:]]*$/ { capture=1; next }
              /^## / { if (capture) exit }
              capture { print }
            ')"
          fi
          if [ -n "$(printf '%s' "$text" | tr -d '[:space:]')" ]; then
            found="true"
          else
            found="false"
            text=""
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          {
            echo "text<<PREVIEW_CHECKLIST_EOF"
            printf '%s\n' "$text"
            echo "PREVIEW_CHECKLIST_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Preview checklist found: $found (PR #$pr_number)"

      - name: Notify Telegram
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHECKLIST_FOUND: ${{ steps.checklist.outputs.found }}
          CHECKLIST_TEXT: ${{ steps.checklist.outputs.text }}
        run: |
          set -euo pipefail
          telegram_token="$(printf '%s' "$TELEGRAM_MAIN_BOT_TOKEN" | tr -d '[:space:]')"
          chat_id="$(printf '%s' "$TELEGRAM_PREVIEW_CHAT_ID" | tr -d '[:space:]')"
          if [[ ! "$telegram_token" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo 'TELEGRAM_MAIN_BOT_TOKEN has an invalid format.' >&2
            exit 1
          fi
          if [[ ! "$chat_id" =~ ^-?[0-9]+$ ]]; then
            echo 'TELEGRAM_PREVIEW_CHAT_ID must be numeric.' >&2
            exit 1
          fi
          if [ "$CHECKLIST_FOUND" = "true" ]; then
            scenario="$CHECKLIST_TEXT"
          elif [ "$PR_NUMBER" = "n/a" ]; then
            scenario="Сценарий проверки не указан в PR — проверьте вручную."
          else
            scenario="$(printf 'Сценарий проверки не указан в PR — проверьте вручную.\nDiff: https://github.com/%s/pull/%s/files' "$GITHUB_REPOSITORY" "$PR_NUMBER")"
          fi
          preview_app_url="$PREVIEW_URL"
          if [ "$PR_NUMBER" = "485" ]; then
            preview_app_url="${PREVIEW_URL%/}/?ui_lab=baseline"
            scenario="UI Lab · Эталон\n\n$scenario"
          elif [ "$PR_NUMBER" = "486" ]; then
            preview_app_url="${PREVIEW_URL%/}/?ui_lab=compare"
            scenario="UI Lab · Compare\n\n$scenario"
          fi
          # printf interprets \n in its format string as a real newline byte;
          # a plain "..." bash assignment does not — the old code put the two
          # literal characters "\" and "n" into the Telegram message text.
          message="$(printf 'Mentalix preview PR #%s готов к проверке.\n\n%s' "$PR_NUMBER" "$scenario")"
          payload="$(jq -n \
            --arg chat_id "$chat_id" \
            --arg text "$message" \
            --arg url "$preview_app_url" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: false, reply_markup: {inline_keyboard: [[{text: "Открыть Preview · Эталон", web_app: {url: $url}}]]}}')"
          # No --fail here on purpose: it discards the response body on a
          # non-2xx status, which previously left failed runs with only
          # "curl: (22) ... error 403" in the log and no way to see what
          # Telegram actually said. Split status/body via a trailing
          # %{http_code} line instead, so a failure logs the real body.
          http_response="$(curl --silent --show-error --max-time 20 \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            --write-out $'\n%{http_code}' \
            "https://api.telegram.org/bot${telegram_token}/sendMessage")"
          http_status="${http_response##*$'\n'}"
          response="${http_response%$'\n'*}"
          if [ "$http_status" != "200" ] || ! printf '%s' "$response" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "Telegram sendMessage failed (HTTP $http_status):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo "Telegram notification sent."

      - name: Comment preview evidence on PR
        if: success() && steps.pr.outputs.number != 'n/a' && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PREVIEW_SHA: ${{ env.PREVIEW_SHA }}
          PREVIEW_BRANCH: ${{ env.PREVIEW_BRANCH }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const body = [
              '## Telegram Preview evidence',
              '',
              `Preview: ${process.env.PREVIEW_URL}`,
              `Branch: \\`${process.env.PREVIEW_BRANCH}\\``,
              `Commit: \\`${process.env.PREVIEW_SHA.slice(0, 8)}\\``,
              '',
              'Vercel Preview и `/api/health` проверены; кнопка отправлена в Telegram.',
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Publish preview summary
        if: always()
        run: |
          {
            echo "### Telegram Preview"
            echo "Preview: ${PREVIEW_URL}"
            echo "Branch: ${PREVIEW_BRANCH}"
            echo "Commit: ${PREVIEW_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
