name: Telegram Preview

on:
  # Kept as a compatibility trigger for existing Vercel callbacks. It is
  # intentionally a no-op: only workflow_dispatch may send Telegram messages.
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      url:
        description: 'Existing Vercel Preview URL to verify and notify'
        required: true
        type: string
      branch:
        description: 'Branch name shown in Telegram (main for the main Preview)'
        required: true
        type: string
      pr_number:
        description: 'PR number; leave empty only for main or unknown Preview'
        required: false
        default: ''
        type: string
      preview_title:
        description: 'Short Preview title, for example Today, Practices, or Evening Review'
        required: false
        default: ''
        type: string
      commit_sha:
        description: 'Commit SHA of the existing Preview deployment'
        required: true
        type: string
      ui_lab_route:
        description: 'Existing UI Lab route, for example experiments or compare'
        required: false
        default: ''
        type: string
      experiment_label:
        description: 'Exact route/experiment label shown in Telegram'
        required: false
        default: ''
        type: string
      diagnostics:
        description: 'Append Preview-only route diagnostics to the Telegram URL'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: telegram-preview-manual-${{ inputs.commit_sha || github.run_id }}-${{ inputs.ui_lab_route || 'default' }}
  cancel-in-progress: true

jobs:
  notify:
    name: Verify existing Vercel preview and notify Telegram
    # repository_dispatch is deliberately accepted but never reaches this job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_PRODUCTION_BOT_TOKEN }}
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      PREVIEW_URL: ${{ inputs.url }}
      PREVIEW_BRANCH: ${{ inputs.branch }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PREVIEW_TITLE: ${{ inputs.preview_title }}
      PREVIEW_SHA: ${{ inputs.commit_sha }}
      UI_LAB_ROUTE: ${{ inputs.ui_lab_route }}
      EXPERIMENT_LABEL: ${{ inputs.experiment_label }}
      PREVIEW_DIAGNOSTICS: ${{ inputs.diagnostics }}

    steps:
      - name: Validate existing Vercel preview metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_URL" ] || [ -z "$PREVIEW_BRANCH" ] || [ -z "$PREVIEW_SHA" ]; then
            echo 'url, branch, and commit_sha are required.' >&2
            exit 1
          fi
          case "$PREVIEW_URL" in
            https://*.vercel.app|https://*.vercel.sh) ;;
            *) echo "Unexpected Preview URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac
          if [ "$PREVIEW_BRANCH" != "main" ] && [ -z "$PR_NUMBER" ]; then
            echo 'pr_number is required for a non-main Preview; unknown Preview must be explicitly sent with branch=unknown.' >&2
            exit 1
          fi
          if [ -n "$PR_NUMBER" ] && ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo 'pr_number must be numeric when provided.' >&2
            exit 1
          fi
          if [ "$PREVIEW_BRANCH" = "main" ] && [ -n "$PR_NUMBER" ]; then
            echo 'main Preview must not include pr_number.' >&2
            exit 1
          fi

      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            echo 'VERCEL_PROTECTION_BYPASS secret is missing — health check would hit the Vercel SSO wall instead of the app.' >&2
            exit 1
          fi
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused --max-time 20 \
            --header "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            "$PREVIEW_URL/api/health")"
          printf '%s\n' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Build canonical Telegram message
        id: message
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${PREVIEW_SHA:0:8}"
          preview_app_url="${PREVIEW_URL%/}"
          route_line=""
          button_label="Открыть Preview"
          if [ -n "$EXPERIMENT_LABEL" ]; then
            route_line="Route: $EXPERIMENT_LABEL"
            button_label="Открыть $EXPERIMENT_LABEL"
          elif [ -n "$PREVIEW_TITLE" ]; then
            route_line="Route: $PREVIEW_TITLE"
            button_label="Открыть $PREVIEW_TITLE"
          fi
          if [ -n "$UI_LAB_ROUTE" ]; then
            preview_app_url="${preview_app_url}/?ui_lab=${UI_LAB_ROUTE}"
          fi
          if [ "$PREVIEW_DIAGNOSTICS" = "true" ]; then
            separator='&'
            if [[ "$preview_app_url" != *\?* ]]; then separator='?'; fi
            preview_app_url="${preview_app_url}${separator}preview_diagnostics=1"
          fi
          if [ "$PREVIEW_BRANCH" = "main" ]; then
            message="$(printf 'Mentalix main Preview\nCommit: %s' "$short_sha")"
          elif [ -n "$PR_NUMBER" ]; then
            title_suffix=""
            if [ -n "$PREVIEW_TITLE" ]; then title_suffix=" · $PREVIEW_TITLE"; fi
            message="$(printf 'Mentalix Preview PR #%s%s\nBranch: %s\nCommit: %s' "$PR_NUMBER" "$title_suffix" "$PREVIEW_BRANCH" "$short_sha")"
            if [ -n "$route_line" ]; then message="$(printf '%s\n%s' "$message" "$route_line")"; fi
          else
            message="$(printf 'Mentalix Preview\nBranch: %s\nCommit: %s' "$PREVIEW_BRANCH" "$short_sha")"
            if [ -n "$route_line" ]; then message="$(printf '%s\n%s' "$message" "$route_line")"; fi
          fi
          if [ "$UI_LAB_ROUTE" = "practice-catalog" ]; then
            message="$(printf '%s\n\nПроверить manual-gate:\n• rail: карточки ~165px, FEATURED/lock, peek+dots, реальный swipe\n• «Тема недели»: ~420px и pagination\n• «Коллекции»: статичная сетка 2 колонки\n• bottom-sheet «Чек-ин эмоций»\n• safe area и нижняя навигация в Telegram/iPhone' "$message")"
          fi
          printf 'message<<PREVIEW_MESSAGE_EOF\n%s\nPREVIEW_MESSAGE_EOF\n' "$message" >> "$GITHUB_OUTPUT"
          printf 'url=%s\nbutton_label=%s\n' "$preview_app_url" "$button_label" >> "$GITHUB_OUTPUT"

      - name: Identify Telegram notifier bot
        shell: bash
        run: |
          set -euo pipefail
          telegram_token="$(printf '%s' "$TELEGRAM_MAIN_BOT_TOKEN" | tr -d '[:space:]')"
          response="$(curl --silent --show-error --max-time 20 "https://api.telegram.org/bot${telegram_token}/getMe")"
          printf '%s\n' "$response" | jq '{ok, result: {id: .result.id, username: .result.username, first_name: .result.first_name}}'

      - name: Notify Telegram
        shell: bash
        env:
          MESSAGE: ${{ steps.message.outputs.message }}
          PREVIEW_APP_URL: ${{ steps.message.outputs.url }}
          BUTTON_LABEL: ${{ steps.message.outputs.button_label }}
        run: |
          set -euo pipefail
          telegram_token="$(printf '%s' "$TELEGRAM_MAIN_BOT_TOKEN" | tr -d '[:space:]')"
          chat_id="$(printf '%s' "$TELEGRAM_PREVIEW_CHAT_ID" | tr -d '[:space:]')"
          if [[ ! "$telegram_token" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo 'TELEGRAM_MAIN_BOT_TOKEN has an invalid format.' >&2; exit 1
          fi
          if [[ ! "$chat_id" =~ ^-?[0-9]+$ ]]; then
            echo 'TELEGRAM_PREVIEW_CHAT_ID must be numeric.' >&2; exit 1
          fi
          payload="$(jq -n --arg chat_id "$chat_id" --arg text "$MESSAGE" \
            --arg url "$PREVIEW_APP_URL" --arg button_label "$BUTTON_LABEL" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: false, reply_markup: {inline_keyboard: [[{text: $button_label, web_app: {url: $url}}]]}}')"
          http_response="$(curl --silent --show-error --max-time 20 --request POST \
            --header 'Content-Type: application/json; charset=utf-8' --data "$payload" \
            --write-out $'\n%{http_code}' "https://api.telegram.org/bot${telegram_token}/sendMessage")"
          http_status="${http_response##*$'\n'}"
          response="${http_response%$'\n'*}"
          if [ "$http_status" != "200" ] || ! printf '%s' "$response" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "Telegram sendMessage failed (HTTP $http_status):" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo 'Telegram notification sent.'

      - name: Publish preview summary
        if: always()
        run: |
          {
            echo '### Telegram Preview'
            echo "Existing Preview: ${PREVIEW_URL}"
            echo "Branch: ${PREVIEW_BRANCH}"
            echo "Commit: ${PREVIEW_SHA}"
            echo 'Vercel deployment: not created by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
