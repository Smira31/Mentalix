name: Telegram Preview

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      url:
        description: 'Vercel Preview URL to verify and notify'
        required: true
        type: string
      branch:
        description: 'Branch name shown in Telegram'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: telegram-preview-${{ github.event.client_payload.gitCommitSha || inputs.url || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    name: Verify Vercel preview and notify Telegram
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.action == 'vercel.deployment.success' && github.event.client_payload.environment == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_MAIN_BOT_TOKEN }}
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
      PREVIEW_URL: ${{ github.event.client_payload.url || inputs.url }}
      PREVIEW_ENVIRONMENT: ${{ github.event.client_payload.environment || 'preview' }}
      PREVIEW_BRANCH: ${{ github.event.client_payload.gitBranch || inputs.branch || 'unknown' }}
      PREVIEW_SHA: ${{ github.event.client_payload.gitCommitSha || github.sha }}
      PR_NUMBER: ${{ github.event.client_payload.gitPullRequestId || 'n/a' }}

    steps:
      - name: Validate Vercel preview payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PREVIEW_ENVIRONMENT" != "preview" ]; then
            echo "Ignoring non-preview deployment: $PREVIEW_ENVIRONMENT"
            exit 1
          fi
          case "$PREVIEW_URL" in
            https://*.vercel.app|https://*.vercel.sh) ;;
            *) echo "Unexpected Preview URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac

      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused --max-time 20 "$PREVIEW_URL/api/health")"
          printf '%s\n' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Resolve PR number
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # client_payload.gitPullRequestId from Vercel's repository_dispatch is
          # not populated in practice (confirmed on real vercel.deployment.success
          # events, not just workflow_dispatch) — resolve independently from the
          # branch name instead, which does arrive correctly.
          resolved="$PR_NUMBER"
          if [ "$resolved" = "n/a" ] && [ -n "$PREVIEW_BRANCH" ] && [ "$PREVIEW_BRANCH" != "unknown" ] && [ "$PREVIEW_BRANCH" != "main" ]; then
            found="$(gh pr list --repo "${{ github.repository }}" --head "$PREVIEW_BRANCH" --state open --json number --jq '.[0].number // empty' || true)"
            if [ -n "$found" ]; then
              resolved="$found"
            fi
          fi
          echo "number=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved PR number: $resolved (client_payload had: $PR_NUMBER, branch: $PREVIEW_BRANCH)"

      - name: Notify Telegram
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          telegram_token="$(printf '%s' "$TELEGRAM_MAIN_BOT_TOKEN" | tr -d '[:space:]')"
          chat_id="$(printf '%s' "$TELEGRAM_PREVIEW_CHAT_ID" | tr -d '[:space:]')"
          if [[ ! "$telegram_token" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo 'TELEGRAM_MAIN_BOT_TOKEN has an invalid format.' >&2
            exit 1
          fi
          if [[ ! "$chat_id" =~ ^-?[0-9]+$ ]]; then
            echo 'TELEGRAM_PREVIEW_CHAT_ID must be numeric.' >&2
            exit 1
          fi
          # printf interprets \n in its format string as a real newline byte;
          # a plain "..." bash assignment does not — the old code put the two
          # literal characters "\" and "n" into the Telegram message text.
          message="$(printf 'Mentalix preview PR #%s готов к проверке.\nПроверьте сценарий: Today → открыть practice → завершить → убедиться, что приложение возвращает в Today. Отдельно проверьте Back и ранний выход.' "$PR_NUMBER")"
          payload="$(jq -n \
            --arg chat_id "$chat_id" \
            --arg text "$message" \
            --arg url "$PREVIEW_URL" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: false, reply_markup: {inline_keyboard: [[{text: "Открыть Preview", web_app: {url: $url}}]]}}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            "https://api.telegram.org/bot${telegram_token}/sendMessage")"
          printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null
          echo "Telegram notification sent."

      - name: Comment preview evidence on PR
        if: success() && steps.pr.outputs.number != 'n/a' && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PREVIEW_SHA: ${{ env.PREVIEW_SHA }}
          PREVIEW_BRANCH: ${{ env.PREVIEW_BRANCH }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const body = [
              '## Telegram Preview evidence',
              '',
              `Preview: ${process.env.PREVIEW_URL}`,
              `Branch: \\`${process.env.PREVIEW_BRANCH}\\``,
              `Commit: \\`${process.env.PREVIEW_SHA.slice(0, 8)}\\``,
              '',
              'Vercel Preview и `/api/health` проверены; кнопка отправлена в Telegram.',
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Publish preview summary
        if: always()
        run: |
          {
            echo "### Telegram Preview"
            echo "Preview: ${PREVIEW_URL}"
            echo "Branch: ${PREVIEW_BRANCH}"
            echo "Commit: ${PREVIEW_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
