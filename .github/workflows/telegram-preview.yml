name: Telegram Preview

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      url:
        description: 'Vercel Preview URL to verify and notify'
        required: true
        type: string
      branch:
        description: 'Branch name shown in Telegram'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-preview-${{ github.event.client_payload.gitCommitSha || inputs.url || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    name: Verify Vercel preview and notify Telegram
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.action == 'vercel.deployment.success' && github.event.client_payload.environment == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_MAIN_BOT_TOKEN }}
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
      PREVIEW_URL: ${{ github.event.client_payload.url || inputs.url }}
      PREVIEW_ENVIRONMENT: ${{ github.event.client_payload.environment || 'preview' }}
      PREVIEW_BRANCH: ${{ github.event.client_payload.gitBranch || inputs.branch || 'unknown' }}
      PREVIEW_SHA: ${{ github.event.client_payload.gitCommitSha || github.sha }}
      PR_NUMBER: ${{ github.event.client_payload.gitPullRequestId || 'n/a' }}

    steps:
      - name: Validate Vercel preview payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PREVIEW_ENVIRONMENT" != "preview" ]; then
            echo "Ignoring non-preview deployment: $PREVIEW_ENVIRONMENT"
            exit 1
          fi
          case "$PREVIEW_URL" in
            https://*.vercel.app|https://*.vercel.sh) ;;
            *) echo "Unexpected Preview URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac

      - name: Verify preview health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused --max-time 20 "$PREVIEW_URL/api/health")"
          printf '%s\n' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Notify Telegram
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${PREVIEW_SHA:0:7}"
          message="Mentalix Preview готов\n\nВетка: $PREVIEW_BRANCH\nCommit: $short_sha\nPR: #$PR_NUMBER\n\nPreview прошёл проверку /api/health."
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_PREVIEW_CHAT_ID" \
            --arg text "$message" \
            --arg url "$PREVIEW_URL" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: false, reply_markup: {inline_keyboard: [[{text: "Открыть Preview", web_app: {url: $url}}]]}}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_MAIN_BOT_TOKEN}/sendMessage")"
          printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null
          echo "Telegram notification sent."

      - name: Publish preview summary
        if: always()
        run: |
          {
            echo "### Telegram Preview"
            echo "Preview: ${PREVIEW_URL}"
            echo "Branch: ${PREVIEW_BRANCH}"
            echo "Commit: ${PREVIEW_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
