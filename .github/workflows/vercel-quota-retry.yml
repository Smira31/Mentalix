name: Vercel Quota Retry

# Retries the Mentalix production deploy on Vercel once the free-tier
# `api-deployments-free-per-day` quota resets. Triggers the project's
# Deploy Hook every hour, checks the *actual* deployment status via the
# Vercel API (not just that the hook call succeeded), and once a READY
# deployment for the current main HEAD is confirmed, notifies Telegram
# and disables itself (`gh workflow disable`) so it stops polling.
#
# Does not delete the Deploy Hook or this workflow on success — both
# stay in place, disabled, for the next time the quota blocks a deploy.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: vercel-quota-retry
  cancel-in-progress: false

jobs:
  retry:
    name: Trigger deploy hook and verify Vercel status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_DEPLOY_HOOK_MENTALIX: ${{ secrets.VERCEL_DEPLOY_HOOK_MENTALIX }}
      VERCEL_TEAM_ID: team_5PXF6CDMzVwO9tn2bYqwHGX5
      TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_MAIN_BOT_TOKEN }}
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Guard required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${VERCEL_TOKEN:-}" ] && missing+=("VERCEL_TOKEN")
          [ -z "${VERCEL_DEPLOY_HOOK_MENTALIX:-}" ] && missing+=("VERCEL_DEPLOY_HOOK_MENTALIX")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            echo "### Vercel Quota Retry — skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Current main HEAD
        id: head
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Current main HEAD: $sha"

      - name: Trigger Vercel deploy hook
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --max-time 30 \
            --request POST "$VERCEL_DEPLOY_HOOK_MENTALIX")"
          echo "Deploy hook response: $response"
          job_id="$(printf '%s' "$response" | jq -r '.job.id // empty')"
          if [ -z "$job_id" ]; then
            echo "Deploy hook did not return a job id — quota is likely still exhausted. Will retry next hour."
            echo "### Vercel Quota Retry — quota still exhausted" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$response" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "ready=pending" >> "$GITHUB_OUTPUT"

      - name: Poll deployment status
        id: poll
        if: steps.trigger.outputs.ready == 'pending'
        shell: bash
        run: |
          set -euo pipefail
          job_id="${{ steps.trigger.outputs.job_id }}"
          state="UNKNOWN"
          deployed_sha=""
          deployment_url=""
          for attempt in $(seq 1 20); do
            sleep 15
            info="$(curl --silent --show-error --max-time 20 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/${job_id}?teamId=${VERCEL_TEAM_ID}")"
            state="$(printf '%s' "$info" | jq -r '.readyState // .status // "UNKNOWN"')"
            deployed_sha="$(printf '%s' "$info" | jq -r '.meta.githubCommitSha // .gitSource.sha // empty')"
            deployment_url="$(printf '%s' "$info" | jq -r '.url // empty')"
            echo "Attempt $attempt: readyState=$state sha=${deployed_sha:-unknown}"
            if [ "$state" = "READY" ] || [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              break
            fi
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel Quota Retry — poll result"
            echo "State: $state"
            echo "Deployed commit: ${deployed_sha:-unknown}"
            echo "Expected main HEAD: ${{ steps.head.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram on confirmed READY deploy
        if: steps.trigger.outputs.ready == 'pending' && steps.poll.outputs.state == 'READY' && steps.poll.outputs.deployed_sha == steps.head.outputs.sha
        shell: bash
        run: |
          set -euo pipefail
          telegram_token="$(printf '%s' "$TELEGRAM_MAIN_BOT_TOKEN" | tr -d '[:space:]')"
          chat_id="$(printf '%s' "$TELEGRAM_PREVIEW_CHAT_ID" | tr -d '[:space:]')"
          if [[ ! "$telegram_token" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo 'TELEGRAM_MAIN_BOT_TOKEN has an invalid format.' >&2
            exit 1
          fi
          if [[ ! "$chat_id" =~ ^-?[0-9]+$ ]]; then
            echo 'TELEGRAM_PREVIEW_CHAT_ID must be numeric.' >&2
            exit 1
          fi
          sha="${{ steps.head.outputs.sha }}"
          short_sha="${sha:0:8}"
          message="Mentalix прод-деплой прошёл после сброса Vercel-квоты.\nКоммит: ${short_sha} (main HEAD, сверено).\nhttps://mentalix.vercel.app"
          payload="$(jq -n \
            --arg chat_id "$chat_id" \
            --arg text "$message" \
            --arg url "https://mentalix.vercel.app" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: false, reply_markup: {inline_keyboard: [[{text: "Открыть Mentalix", web_app: {url: $url}}]]}}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            "https://api.telegram.org/bot${telegram_token}/sendMessage")"
          printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null
          echo "Telegram notification sent."
          echo "### Vercel Quota Retry — success" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed and notified: ${short_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Disable this workflow after confirmed success
        if: steps.trigger.outputs.ready == 'pending' && steps.poll.outputs.state == 'READY' && steps.poll.outputs.deployed_sha == steps.head.outputs.sha
        shell: bash
        run: |
          set -euo pipefail
          gh workflow disable "vercel-quota-retry.yml" --repo "${{ github.repository }}"
          echo "Workflow disabled — deploy succeeded, no further hourly retries. Deploy Hook and this file are kept for future use; re-enable with: gh workflow enable vercel-quota-retry.yml" >> "$GITHUB_STEP_SUMMARY"

      - name: Log unresolved state
        if: steps.trigger.outputs.ready == 'pending' && steps.poll.outputs.state != 'READY'
        shell: bash
        run: |
          echo "Deployment did not reach READY within this run's polling window (state: ${{ steps.poll.outputs.state }}). Next hourly run will retry." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log commit mismatch
        if: steps.trigger.outputs.ready == 'pending' && steps.poll.outputs.state == 'READY' && steps.poll.outputs.deployed_sha != steps.head.outputs.sha
        shell: bash
        run: |
          echo "Deployment reached READY but for a different commit than current main HEAD (deployed: ${{ steps.poll.outputs.deployed_sha }}, expected: ${{ steps.head.outputs.sha }}) — not treating as success, not disabling. Next hourly run will retry." | tee -a "$GITHUB_STEP_SUMMARY"
