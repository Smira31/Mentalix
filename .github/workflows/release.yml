name: Создать релиз Mentalix

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег релиза, например v1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Опубликовать релиз и release notes
    runs-on: ubuntu-latest

    steps:
      - name: Определить тег
        id: release
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Неверный формат тега: $tag. Ожидается vX.Y.Z." >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Релиз Mentalix $TAG" \
            --generate-notes \
            --verify-tag
