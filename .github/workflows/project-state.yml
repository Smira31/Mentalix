name: Журнал состояния Mentalix

on:
  push:
    branches:
      - main
    paths-ignore:
      - PROJECT_STATE.md

permissions:
  contents: write

jobs:
  update-project-state:
    name: Обновить PROJECT_STATE.md
    runs-on: ubuntu-latest

    steps:
      - name: Получить код Mentalix
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Обновить журнал
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:7}"
          changed_files="$(git diff-tree --no-commit-id --name-only -r "$COMMIT_SHA" | paste -sd ', ' -)"
          changed_files="${changed_files:-см. commit}"
          date_utc="$(date -u +%F)"
          {
            printf '\n### %s — %s\n\n' "$date_utc" "$short_sha"
            printf '%s\n\n' "- Автор: $COMMIT_AUTHOR"
            printf '%s\n\n' "- Commit: $COMMIT_MESSAGE"
            printf '%s\n\n' "- Изменённые файлы: $changed_files"
            printf '%s\n\n' '- Автоматические проверки и ручной gate: см. связанный Pull Request.'
          } > /tmp/project-state-entry.md
          awk '
            BEGIN { inserted = 0 }
            /^## 6\. Автоматический журнал изменений/ && !inserted {
              print
              while ((getline line < "/tmp/project-state-entry.md") > 0) print line
              inserted = 1
              next
            }
            { print }
          ' PROJECT_STATE.md > /tmp/PROJECT_STATE.md
          mv /tmp/PROJECT_STATE.md PROJECT_STATE.md

      - name: Сохранить журнал
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo 'Новых данных для журнала нет.'
            exit 0
          fi
          git commit -m 'docs: обновить журнал состояния проекта [skip ci]'
          git push
