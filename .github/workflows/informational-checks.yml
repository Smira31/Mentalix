name: Informational checks (manual)

# Тяжёлые необязательные визуальные и диагностические проверки, снятые с каждого
# PR и push ради экономии GitHub Actions-минут (issue #1111, этап 2).
#
# Раньше эти job'ы запускались на каждом pull_request/push вместе с обязательными
# проверками. Теперь они запускаются только вручную:
#   Actions → «Informational checks (manual)» → Run workflow
# Если указать номер PR, работа идёт на его head (refs/pull/<N>/head), а
# «было / стало» и скриншоты попадают в артефакты run и в Summary прогона.
# Комментарии в PR не публикуются: токену не выдаются права на запись.
# Код сторонних fork-PR не запускается — job guard допускает только PR из этого
# репозитория (read-only токен тоже имеет доступ к данным приватного репозитория).
# Без номера — проверяется выбранная ветка, артефакты складываются в run.
#
# Обязательные проверки (quality, backend-health, UX-смоук, «Функциональная
# проверка проекта») остаются в ci.yml и не затрагиваются.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Номер PR этого репозитория: сборка его head, отчёты в артефактах и Summary (пусто — выбранная ветка)"
        required: false
        type: string

# Только чтение. Workflow может проверять код произвольного PR
# (refs/pull/<N>/head) и выполняет на нём npm-команды, поэтому права на запись
# ему не выдаются: отчёты складываются в артефакты и $GITHUB_STEP_SUMMARY.
# pull-requests: read нужен job'у guard — прочитать, из какого репозитория
# пришёл PR, и не запускать код сторонних fork-PR.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: informational-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.1

jobs:
  # Проверяем источник PR до тяжёлых job'ов: даже read-only токен имеет доступ
  # к данным приватного репозитория, поэтому код сторонних fork-PR не запускаем.
  guard:
    name: Guard — PR только из этого репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Resolve PR head repository
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ inputs.pr_number }}"
          if [ -z "$pr" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR не задан — проверяется ветка ${{ github.ref }}"
            exit 0
          fi
          # Пустой ответ (ошибка API, удалённый форк) тоже запрещает запуск.
          head_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
            --jq '.head.repo.full_name // ""' 2>/dev/null || echo "")
          echo "PR #${pr} head repo: ${head_repo:-<не определён>}"
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::PR #${pr} пришёл из «${head_repo:-не определён}» — код сторонних fork-PR не запускается"
            exit 1
          fi

  ux-visual:
    name: Playwright visual snapshots (informational)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # Токен не остаётся в .git/config — код PR не должен его читать.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download baselines from main
        id: download-baselines
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=visual-baselines.yml \
            --branch=main --status=completed --conclusion=success \
            --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ]; then
            echo "baselines_downloaded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Нет артефакта эталонов с main — bootstrap: генерация из текущей ветки"
            exit 0
          fi
          echo "Скачиваю эталоны из run $RUN_ID"
          gh run download "$RUN_ID" --name visual-baselines \
            --dir tests/ux/ux-check.spec.mjs-snapshots/
          echo "baselines_downloaded=true" >> "$GITHUB_OUTPUT"

      - name: Run visual snapshots
        continue-on-error: true
        env:
          RUN_VISUAL_SNAPSHOTS: 'true'
          UX_FIXED_TIME: '08:00'
        run: |
          if [ "${{ steps.download-baselines.outputs.baselines_downloaded }}" = "true" ]; then
            npm run ux:check -- --retries=1
          else
            npm run ux:check -- --update-snapshots --retries=1
          fi

      - name: Generate diff report
        if: always()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/visual-diff-report.mjs

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: visual-diff-${{ inputs.pr_number || github.run_number }}
          path: |
            artifacts/ux-check/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Отчёт идёт в Summary прогона (без токена и без прав на запись).
      - name: Publish «было / стало» to summary
        if: always()
        run: |
          {
            echo '## 📸 Визуальные изменения: было / стало'
            echo
            if [ -f artifacts/ux-check/visual-diff-report.md ]; then
              cat artifacts/ux-check/visual-diff-report.md
            else
              echo '⚠️ Не удалось сформировать отчёт визуального diff.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ux-visual-progress:
    name: Progress visual snapshots (demo mode, informational)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # Токен не остаётся в .git/config — код PR не должен его читать.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download progress baselines from main
        id: download-baselines
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=visual-baselines.yml \
            --branch=main --status=completed --conclusion=success \
            --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ]; then
            echo "baselines_downloaded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Нет артефакта эталонов Прогресса с main — bootstrap: генерация из текущей ветки"
            exit 0
          fi
          echo "Скачиваю эталоны Прогресса из run $RUN_ID"
          gh run download "$RUN_ID" --name visual-baselines-progress \
            --dir tests/ux/progress-tabs-visual.spec.mjs-snapshots/
          echo "baselines_downloaded=true" >> "$GITHUB_OUTPUT"

      - name: Run progress visual snapshots
        continue-on-error: true
        env:
          RUN_VISUAL_SNAPSHOTS: 'true'
          UX_FIXED_TIME: '08:00'
        run: |
          if [ "${{ steps.download-baselines.outputs.baselines_downloaded }}" = "true" ]; then
            npm run ux:progress-visual -- --retries=1
          else
            npm run ux:progress-visual -- --update-snapshots --retries=1
          fi

      - name: Upload progress visual artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: progress-visual-diff-${{ inputs.pr_number || github.run_number }}
          path: |
            artifacts/progress-visual/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  qa-crawl:
    name: QA обход (informational)
    needs: guard
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # Токен не остаётся в .git/config — код PR не должен его читать.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run QA crawl
        env:
          QA_FIXED_TIME: '08:00'
        run: npm run qa:crawl

      - name: Upload QA report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qa-report
          path: qa-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish summary
        if: always()
        run: |
          if [ -f qa-report/summary.md ]; then
            cat qa-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle-size-report:
    name: Отчёт о размерах чанков (informational)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # Токен не остаётся в .git/config — код PR не должен его читать.
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build branch
        run: npm run build

      # Сборку ветки уносим из рабочей папки: checkout main её не трогает.
      # Скрипт тоже — иначе checkout main затрёт его версией из main.
      - name: Save branch dist
        run: |
          mv dist "$RUNNER_TEMP/dist-pr"
          cp scripts/bundle-size-report.mjs "$RUNNER_TEMP/bundle-size-report.mjs"

      - name: Checkout main
        run: |
          git checkout origin/main -- .

      - name: Install dependencies (main)
        run: npm ci

      - name: Build main
        run: npm run build

      - name: Generate bundle size report
        run: node "$RUNNER_TEMP/bundle-size-report.mjs" "$RUNNER_TEMP/dist-pr" dist > bundle-report.md

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundle-report-${{ inputs.pr_number || github.run_number }}
          path: bundle-report.md
          if-no-files-found: ignore
          retention-days: 7

      # Отчёт идёт в Summary прогона (без токена и без прав на запись).
      - name: Publish bundle size report to summary
        if: always()
        run: |
          {
            echo '## 📦 Размеры чанков сборки'
            echo
            if [ -f bundle-report.md ]; then
              cat bundle-report.md
            else
              echo '⚠️ Не удалось сформировать отчёт.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pr-screenshots:
    name: PR-скриншоты экранов (informational)
    needs: guard
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # Токен не остаётся в .git/config — код PR не должен его читать.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Демо-режим (?demo=1) в собранной версии работает только с этим флагом.
      - name: Build preview
        run: VITE_LOCAL_PREVIEW=true npm run build

      - name: Start preview server
        run: npx vite preview --host 127.0.0.1 --port 4173 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:4173 --timeout 30000

      - name: Capture PR screenshots
        run: node tests/visual/pr-screens.mjs
        env:
          PR_SCREENSHOTS_BASE_URL: 'http://127.0.0.1:4173'

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-screenshots-${{ inputs.pr_number || github.run_number }}
          path: artifacts/pr-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      # Список скриншотов идёт в Summary прогона (без токена и без прав на запись).
      - name: Publish screenshots note to summary
        if: always()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## 📸 Скриншоты ключевых экранов'
            echo
            if [ -f artifacts/pr-screenshots/README.md ]; then
              cat artifacts/pr-screenshots/README.md
            else
              echo '⚠️ Скриншоты не сгенерированы.'
            fi
            echo
            echo "🔗 [Артефакт со скриншотами]($GITHUB_RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
