# Только ручной запуск. Production — Timeweb.
# Файл хранит флаги прод-сборки, его читает tests/unit/web-auth-email-toggle.test.mjs —
# не удалять без отдельного решения владельца.
name: Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: /api
  # Публичное имя бота для Telegram Login (не секрет); домен привязан в BotFather.
  VITE_TELEGRAM_BOT_USERNAME: Mentalix_club_bot
  # Нет своего домена в Resend — письма с кодом не уходят, вход по email скрыт.
  VITE_EMAIL_LOGIN_ENABLED: 'false'
  # Веб-оплата Mentalix Pro включена в прод-сборке (читается в src/lib/paymentConfig.js).
  VITE_PAYMENT_UI_ENABLED: 'true'
  # Pro «Разбор и план недели»: витрина и экраны включены в прод-сборке (src/lib/proFlag.js).
  # Бэкенд-флаги PRO_WEEKLY_* на Render уже включены.
  VITE_PRO_REVIEW_PLAN_ENABLED: 'true'

jobs:
  build-and-deploy:
    name: Build and deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the production workflow self-verifying even when it is started manually.
      # check:core includes unit tests, lint, the production build and active-doc checks.
      - name: Run production quality gate
        run: npm run check:core

      - name: Deploy production to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Smoke-check Firebase Production
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://mentalix-production.web.app/
