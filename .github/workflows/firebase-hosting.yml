name: Firebase Hosting

on:
  workflow_run:
    workflows:
      - Mentalix CI baseline
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: /api

jobs:
  build-and-deploy:
    name: Build and deploy Firebase Hosting
    # A PR from a fork cannot deploy: only a completed push workflow for this
    # repository's own main branch satisfies all workflow_run predicates below.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the production workflow self-verifying even when it is started manually.
      # check:core includes unit tests, lint, the production build and active-doc checks.
      - name: Run production quality gate
        run: npm run check:core

      - name: Deploy production to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Smoke-check Firebase Production
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://mentalix-production.web.app/
