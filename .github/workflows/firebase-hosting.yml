name: Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: https://mentalix-bot.onrender.com/api

jobs:
  build-and-deploy:
    name: Build and deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the production workflow self-verifying even when it is started manually.
      # check:core includes unit tests, lint, the production build and active-doc checks.
      - name: Run production quality gate
        run: npm run check:core

      - name: Deploy production to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Smoke-check Firebase Production
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://mentalix-production.web.app/
