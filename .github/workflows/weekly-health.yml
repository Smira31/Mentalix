name: Weekly repository health

on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  health:
    name: Weekly health report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run documentation checks
        run: |
          npm run docs:check
          npm run docs:drift

      - name: Check Render backend
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 https://mentalix-bot.onrender.com/api/health)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | jq -e '.status == "ok"' >/dev/null

      - name: Create or update health report issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[automation] Weekly repository health';
            const body = [
              `## Weekly health report — ${new Date().toISOString().slice(0, 10)}`,
              '',
              `Main SHA: \\`${context.sha.slice(0, 8)}\\``,
              '',
              'Automated checks passed: docs-check, docs-drift, Render `/api/health`.',
              '',
              'This issue is informational. It does not modify product code, merge PRs, rotate secrets, or change production.',
            ].join('\\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
