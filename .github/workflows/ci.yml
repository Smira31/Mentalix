name: Mentalix CI baseline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Устаревшие PR-прогоны отменяются: у PR свой ref (refs/pull/N/merge), поэтому
  # новый push в тот же PR снимает прежний прогон и не считает минуты дважды на
  # старых коммитах. Прогоны main НЕ отменяются — baseline main должен доходить
  # до конца целиком.
  group: mentalix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.22.1
  BACKEND_SHA: 193b5ab178f1a74ffc4c591bb469c92215dc9121

jobs:
  change-scope:
    name: Определение области изменений
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Определить необходимость Render health
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # docs_only=true — ВСЕ изменённые файлы PR оканчиваются на .md и при
          # этом не лежат в src/, public/, tests/, .github/. Пустой diff и push
          # в main считаются «не только документами»: полная проверка остаётся.
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          # core.quotepath=false — чтобы кириллические имена файлов не приходили
          # в кавычках и оканчивались на .md, а не на .md".
          docs_files="$(git -c core.quotepath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          docs_only=false
          if [ -n "$docs_files" ]; then
            not_markdown="$(printf '%s\n' "$docs_files" | grep -Ev '\.md$' || true)"
            forbidden_path="$(printf '%s\n' "$docs_files" | grep -E '^(src|public|tests|\.github)/' || true)"
            if [ -z "$not_markdown" ] && [ -z "$forbidden_path" ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$changed_files" | grep -Eq '^(server/|api/|src/lib/api|src/platform/|package(-lock)?\.json$|\.github/workflows/|firebase\.json$|render\.yaml$|Dockerfile)'; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_required=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Frontend quality
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Защита точек входа (src/main.jsx, src/tgShell.js)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'allow-entry-change') }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/main.jsx src/tgShell.js)"
          if [ -n "$changed" ] && [ "$HAS_LABEL" != "true" ]; then
            printf '%s\n' "$changed"
            echo "::error::src/main.jsx и src/tgShell.js нельзя менять без метки allow-entry-change. Ошибка сборки в контейнере агента — не причина"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core checks
        run: npm run check:core

      - name: Check documentation drift
        run: npm run docs:drift

      - name: Статус контракта вне доверенного main (advisory)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || github.repository != 'Smira31/Mentalix'
        run: |
          echo 'CONTRACT_STATUS=SKIPPED reason=untrusted_context'
          echo 'Контракт API: **SKIPPED** — приватный контракт не передаётся коду PR или недоверенной ветки.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check canonical documentation drift (advisory)
        continue-on-error: true
        run: npm run docs:canonical-drift

  backend-contract:
    name: Контракт API (advisory)
    needs: quality
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && github.repository == 'Smira31/Mentalix'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    continue-on-error: true
    # Before adding the secret, restrict this environment to selected branch main.
    environment: backend-contract-read
    permissions:
      contents: read
    steps:
      - name: Checkout доверенного SHA main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Проверить приватный контракт без публикации содержимого
        env:
          CONTRACT_TRUSTED_CONTEXT: 'true'
          BACKEND_CONTRACT_TOKEN: ${{ secrets.BACKEND_CONTRACT_TOKEN }}
        run: node scripts/check-api-contract.mjs

  ux:
    name: Playwright smoke (${{ matrix.group }})
    # PR, меняющий только документы, не гоняет Playwright smoke: запускаются
    # лишь PR с кодом (docs_only=false), push в main и workflow_dispatch.
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs:
      - quality
      - change-scope
    timeout-minutes: 30
    strategy:
      # Группы независимы: провал одной не отменяет остальные, и агрегат
      # «Функциональная проверка проекта» видит результат каждой из них.
      fail-fast: false
      matrix:
        # Три группы примерно равной длительности; состав и обоснование —
        # docs/engineering/notes/ci.md. Ни один набор не дублируется и не
        # теряется: объединение групп равно прежнему одиночному job.
        group:
          - smoke-day
          - smoke-evening
          - webkit-gates
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ключ кэша — версия @playwright/test из package-lock.json, а не хеш
      # файла: правка любого другого пакета больше не сбрасывает браузеры.
      - name: Определить версию @playwright/test
        id: playwright-version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          test -n "$version"
          echo "Версия @playwright/test для ключа кэша: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Кэш браузеров нужен только GitHub-hosted раннеру: на self-hosted Mac
      # браузеры остаются на диске, шаг установки всё равно выполняется.
      - name: Cache Playwright browsers
        id: playwright-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Попадание в кэш: браузеры уже на диске, WebKit не докачивается —
      # ставим только системные зависимости (без них launch падает на libnss3 и др.).
      # ::notice виден в аннотациях job'а: по нему проверяется попадание в кэш
      # на повторном прогоне (в логах GitHub Actions из API его не прочитать).
      # Системные пакеты — только Linux: на macOS это sudo/brew, шаг запрещён.
      - name: Install system dependencies (кэш браузеров найден, Linux)
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "::notice title=Playwright cache::hit ${{ steps.playwright-version.outputs.version }}"
          npx playwright install-deps chromium webkit

      - name: Install Chromium and WebKit with system dependencies (промах кэша, Linux)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "::notice title=Playwright cache::miss ${{ steps.playwright-version.outputs.version }}"
          npx playwright install --with-deps chromium webkit

      # macOS: те же браузеры без системных пакетов; если они уже на диске,
      # команда завершается мгновенно — поэтому шаг выполняется всегда.
      - name: Install Chromium and WebKit (macOS, без системных пакетов)
        if: runner.os == 'macOS'
        run: npx playwright install chromium webkit

      - name: Run UX smoke
        if: matrix.group == 'smoke-day'
        env:
          RUN_VISUAL_SNAPSHOTS: 'false'
          UX_FIXED_TIME: '08:00'
        run: npm run ux:check -- --retries=1

      - name: Run MXL-010 production-like gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:mxl010 -- --retries=1

      - name: Run UX smoke in evening mode
        if: matrix.group == 'smoke-evening'
        env:
          RUN_VISUAL_SNAPSHOTS: 'false'
          UX_FIXED_TIME: '21:00'
        run: npm run ux:check -- --retries=1

      - name: Run journal history profile isolation gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:journal-history -- --retries=1

      - name: Run read-scale typography contract gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:typography -- --retries=1

      - name: Run Telegram React update-depth regression in WebKit
        if: matrix.group == 'webkit-gates'
        run: npm run ux:telegram-react-depth

      - name: Run React #185 check-in regression in WebKit
        if: matrix.group == 'webkit-gates'
        run: npm run ux:react-185-checkin

      - name: Run tap areas and «Назад» offset gate in WebKit
        if: matrix.group == 'webkit-gates'
        run: npm run ux:tap-areas -- --retries=1

      - name: Run keyboard focus contract gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:keyboard -- --retries=1

      - name: Run Pro review states evidence gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:pro-states -- --retries=1

      - name: Run Pro failure states gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:pro-failure-states -- --retries=1

      # Экранам состояний подписки нужен VITE_PAYMENT_UI_ENABLED=true, поэтому
      # у набора свой dev-сервер (playwright.payment-ui.config.mjs), а не ux:check.
      - name: Run payment UI states gate
        if: matrix.group == 'webkit-gates'
        run: npm run ux:payment-ui -- --retries=1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-artifacts-${{ matrix.group }}
          path: |
            artifacts/ux-check/
            artifacts/telegram-react-update-depth/
            artifacts/react-185-checkin/
            artifacts/tap-areas/
            artifacts/journal-history/
            artifacts/typography-readable/
            artifacts/keyboard-focus/
            artifacts/pro-states/
            artifacts/payment-ui/
            test-results/
          if-no-files-found: ignore

  backend-health:
    name: Backend health
    needs: change-scope
    if: needs.change-scope.outputs.backend_required == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    # Внешний production (Timeweb) — не гейт PR: недоступность или изменение
    # ответа API не должно блокировать merge. Результат виден в job, но не в
    # «Функциональная проверка проекта».
    continue-on-error: true
    steps:
      - name: Verify Timeweb backend health
        env:
          TIMEWEB_BACKEND_URL: https://api.mentalix.space
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$TIMEWEB_BACKEND_URL/api/health")"
          printf '%s\n' "$response"
          # Внешние утилиты на Mac не гарантированы, проверяем на node. Ответ — через env.
          RESPONSE="$response" node -e '
          const body = JSON.parse(process.env.RESPONSE);
          if (body.status !== "ok") {
            console.error("health status:", JSON.stringify(body.status));
            process.exit(1);
          }
          '

  security-audit:
    name: Dependency audit
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Информационный job: при заданной vars.CI_RUNS_ON (self-hosted Mac) в PR
    # не запускается, чтобы не удлинять единственную очередь раннера.
    # Push в main и workflow_dispatch идут как раньше.
    if: ${{ !(github.event_name == 'pull_request' && vars.CI_RUNS_ON != '') }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::npm audit found dependency findings; track remediation separately."
          fi
          exit 0

  telegram-p0:
    name: Telegram P0 (informational)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Тот же принцип, что в security-audit: при заданной vars.CI_RUNS_ON
    # информационный прогон в PR не занимает очередь Mac.
    if: ${{ !(github.event_name == 'pull_request' && vars.CI_RUNS_ON != '') }}
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (Linux, с системными пакетами)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (macOS, без системных пакетов)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Run telegram-p0 checks
        env:
          MENTALIX_TELEGRAM_P0_URL: 'http://127.0.0.1:4173/?demo=1&toolbar=1&device=pro-max&tab=today'
        run: npm run ux:telegram-p0 -- --reporter=line,html

      - name: Upload telegram-p0 Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: telegram-p0-report
          path: |
            playwright-report/
            artifacts/telegram-p0-check/
          retention-days: 7
          if-no-files-found: ignore

  required-check:
    name: Функциональная проверка проекта
    if: ${{ always() }}
    needs:
      - quality
      - ux
      - change-scope
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          quality='${{ needs.quality.result }}'
          ux='${{ needs.ux.result }}'
          docs_only='${{ needs.change-scope.outputs.docs_only }}'
          printf 'quality=%s\nux=%s\ndocs_only=%s\n' "$quality" "$ux" "$docs_only"
          test "$quality" = success
          if [ "$ux" = success ]; then
            exit 0
          fi
          # `ux` — агрегат трёх параллельных групп матрицы (fail-fast: false):
          # провал, отмена или пропуск любой группы делает результат не success.
          # Пропуск ux допустим только для документного PR (docs_only=true).
          # Любой другой skipped/failure/cancelled — провал проверки.
          if [ "$ux" = skipped ] && [ "$docs_only" = 'true' ]; then
            echo 'ux=skipped допустим: PR меняет только документы (docs_only=true)'
            exit 0
          fi
          echo "::error::ux=$ux при docs_only=$docs_only — Playwright smoke обязателен"
          exit 1
