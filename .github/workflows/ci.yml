name: Mentalix CI baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentalix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core checks
        run: npm run check:core

      - name: Check documentation drift
        run: npm run docs:drift

  ux:
    name: Playwright Chromium smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UX smoke
        run: npm run ux:check

      - name: Run MXL-010 production-like gate
        run: npm run ux:mxl010

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/ux-check/
            test-results/
          if-no-files-found: ignore

  backend-health:
    name: Backend health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Render backend health
        env:
          RENDER_BACKEND_URL: https://mentalix-bot.onrender.com
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$RENDER_BACKEND_URL/api/health")"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | jq -e '.status == "ok"' >/dev/null

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::npm audit found dependency findings; track remediation separately."
          fi
          exit 0

  required-check:
    name: Базовая проверка проекта
    if: ${{ always() }}
    needs:
      - quality
      - ux
      - backend-health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          quality='${{ needs.quality.result }}'
          ux='${{ needs.ux.result }}'
          backend_health='${{ needs.backend-health.result }}'
          printf 'quality=%s\nux=%s\nbackend-health=%s\n' "$quality" "$ux" "$backend_health"
          test "$quality" = success
          test "$ux" = success
          test "$backend_health" = success
