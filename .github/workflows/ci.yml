name: Mentalix CI baseline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Устаревшие PR-прогоны отменяются: у PR свой ref (refs/pull/N/merge), поэтому
  # новый push в тот же PR снимает прежний прогон и не считает минуты дважды на
  # старых коммитах. Прогоны main НЕ отменяются — baseline main должен доходить
  # до конца целиком.
  group: mentalix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.22.1
  BACKEND_SHA: 193b5ab178f1a74ffc4c591bb469c92215dc9121

jobs:
  change-scope:
    name: Определение области изменений
    runs-on: ubuntu-latest
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Определить необходимость Render health
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(server/|api/|src/lib/api|src/platform/|package(-lock)?\.json$|\.github/workflows/|firebase\.json$|render\.yaml$|Dockerfile)'; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_required=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Защита точек входа (src/main.jsx, src/tgShell.js)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'allow-entry-change') }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/main.jsx src/tgShell.js)"
          if [ -n "$changed" ] && [ "$HAS_LABEL" != "true" ]; then
            printf '%s\n' "$changed"
            echo "::error::src/main.jsx и src/tgShell.js нельзя менять без метки allow-entry-change. Ошибка сборки в контейнере агента — не причина"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core checks
        run: npm run check:core

      - name: Check documentation drift
        run: npm run docs:drift

      - name: Статус контракта вне доверенного main (advisory)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || github.repository != 'Smira31/Mentalix'
        run: |
          echo 'CONTRACT_STATUS=SKIPPED reason=untrusted_context'
          echo 'Контракт API: **SKIPPED** — приватный контракт не передаётся коду PR или недоверенной ветки.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check canonical documentation drift (advisory)
        continue-on-error: true
        run: npm run docs:canonical-drift

  backend-contract:
    name: Контракт API (advisory)
    needs: quality
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && github.repository == 'Smira31/Mentalix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    # Before adding the secret, restrict this environment to selected branch main.
    environment: backend-contract-read
    permissions:
      contents: read
    steps:
      - name: Checkout доверенного SHA main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Проверить приватный контракт без публикации содержимого
        env:
          CONTRACT_TRUSTED_CONTEXT: 'true'
          BACKEND_CONTRACT_TOKEN: ${{ secrets.BACKEND_CONTRACT_TOKEN }}
        run: node scripts/check-api-contract.mjs

  ux:
    name: Playwright Chromium smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run UX smoke
        env:
          RUN_VISUAL_SNAPSHOTS: 'false'
          UX_FIXED_TIME: '08:00'
        run: npm run ux:check -- --retries=1

      - name: Run UX smoke in evening mode
        env:
          RUN_VISUAL_SNAPSHOTS: 'false'
          UX_FIXED_TIME: '21:00'
        run: npm run ux:check -- --retries=1

      - name: Run MXL-010 production-like gate
        run: npm run ux:mxl010 -- --retries=1

      - name: Run Telegram React update-depth regression in WebKit
        run: npm run ux:telegram-react-depth

      - name: Run React #185 check-in regression in WebKit
        run: npm run ux:react-185-checkin

      - name: Run tap areas and «Назад» offset gate in WebKit
        run: npm run ux:tap-areas -- --retries=1

      - name: Run journal history profile isolation gate
        run: npm run ux:journal-history -- --retries=1

      - name: Run read-scale typography contract gate
        run: npm run ux:typography -- --retries=1

      - name: Run keyboard focus contract gate
        run: npm run ux:keyboard -- --retries=1

      - name: Run Pro review states evidence gate
        run: npm run ux:pro-states -- --retries=1

      - name: Run Pro failure states gate
        run: npm run ux:pro-failure-states -- --retries=1

      # Экранам состояний подписки нужен VITE_PAYMENT_UI_ENABLED=true, поэтому
      # у набора свой dev-сервер (playwright.payment-ui.config.mjs), а не ux:check.
      - name: Run payment UI states gate
        run: npm run ux:payment-ui -- --retries=1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-artifacts
          path: |
            artifacts/ux-check/
            artifacts/telegram-react-update-depth/
            artifacts/react-185-checkin/
            artifacts/tap-areas/
            artifacts/journal-history/
            artifacts/typography-readable/
            artifacts/keyboard-focus/
            artifacts/pro-states/
            artifacts/payment-ui/
            test-results/
          if-no-files-found: ignore

  backend-health:
    name: Backend health
    needs: change-scope
    if: needs.change-scope.outputs.backend_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Внешний production (Timeweb) — не гейт PR: недоступность или изменение
    # ответа API не должно блокировать merge. Результат виден в job, но не в
    # «Функциональная проверка проекта».
    continue-on-error: true
    steps:
      - name: Verify Timeweb backend health
        env:
          TIMEWEB_BACKEND_URL: https://api.mentalix.space
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$TIMEWEB_BACKEND_URL/api/health")"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | jq -e '.status == "ok"' >/dev/null

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::npm audit found dependency findings; track remediation separately."
          fi
          exit 0

  telegram-p0:
    name: Telegram P0 (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run telegram-p0 checks
        env:
          MENTALIX_TELEGRAM_P0_URL: 'http://127.0.0.1:4173/?demo=1&toolbar=1&device=pro-max&tab=today'
        run: npm run ux:telegram-p0 -- --reporter=line,html

      - name: Upload telegram-p0 Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: telegram-p0-report
          path: |
            playwright-report/
            artifacts/telegram-p0-check/
          retention-days: 7
          if-no-files-found: ignore

  required-check:
    name: Функциональная проверка проекта
    if: ${{ always() }}
    needs:
      - quality
      - ux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          quality='${{ needs.quality.result }}'
          ux='${{ needs.ux.result }}'
          printf 'quality=%s\nux=%s\n' "$quality" "$ux"
          test "$quality" = success
          test "$ux" = success
