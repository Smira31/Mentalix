name: Mentalix CI baseline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentalix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.1
  BACKEND_SHA: 7fa1cc88d90935fada35bb2b5f6477979cb2cd31

jobs:
  change-scope:
    name: Определение области изменений
    runs-on: ubuntu-latest
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Определить необходимость Render health
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(server/|api/|src/lib/api|src/platform/|package(-lock)?\.json$|\.github/workflows/|firebase\.json$|render\.yaml$|Dockerfile)'; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_required=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Защита точек входа (src/main.jsx, src/tgShell.js)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'allow-entry-change') }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/main.jsx src/tgShell.js)"
          if [ -n "$changed" ] && [ "$HAS_LABEL" != "true" ]; then
            printf '%s\n' "$changed"
            echo "::error::src/main.jsx и src/tgShell.js нельзя менять без метки allow-entry-change. Ошибка сборки в контейнере агента — не причина"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core checks
        run: npm run check:core

      - name: Check documentation drift
        run: npm run docs:drift

      - name: Contract test against backend SHA (advisory)
        continue-on-error: true
        env:
          CONTRACT_FILE: ${{ runner.temp }}/API_CONTRACT.md
        run: |
          set -euo pipefail
          echo "Backend SHA checked: $BACKEND_SHA"
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/Smira31/mentalix-bot/$BACKEND_SHA/docs/API_CONTRACT.md" \
            --output "$CONTRACT_FILE"
          npm run test:contract

      - name: Check canonical documentation drift (advisory)
        continue-on-error: true
        run: npm run docs:canonical-drift

  ux:
    name: Playwright Chromium smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UX smoke
        env:
          RUN_VISUAL_SNAPSHOTS: 'false'
          UX_FIXED_TIME: '08:00'
        run: npm run ux:check -- --retries=1

      - name: Run UX smoke in evening mode
        env:
          RUN_VISUAL_SNAPSHOTS: 'false'
          UX_FIXED_TIME: '21:00'
        run: npm run ux:check -- --retries=1

      - name: Run MXL-010 production-like gate
        run: npm run ux:mxl010 -- --retries=1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-artifacts
          path: |
            artifacts/ux-check/
            test-results/
          if-no-files-found: ignore

  ux-visual:
    name: Playwright visual snapshots (informational)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual snapshots
        env:
          RUN_VISUAL_SNAPSHOTS: 'true'
          UX_FIXED_TIME: '08:00'
        run: npm run ux:check -- --retries=1

      - name: Upload visual artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-visual-artifacts
          path: |
            artifacts/ux-check/
            test-results/
          if-no-files-found: ignore

  backend-health:
    name: Backend health
    needs: change-scope
    if: needs.change-scope.outputs.backend_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Render backend health
        env:
          RENDER_BACKEND_URL: https://mentalix-bot.onrender.com
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$RENDER_BACKEND_URL/api/health")"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | jq -e '.status == "ok"' >/dev/null

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::npm audit found dependency findings; track remediation separately."
          fi
          exit 0

  required-check:
    name: Функциональная проверка проекта
    if: ${{ always() }}
    needs:
      - quality
      - backend-health
      - ux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          quality='${{ needs.quality.result }}'
          backend_health='${{ needs.backend-health.result }}'
          ux='${{ needs.ux.result }}'
          printf 'quality=%s\nbackend-health=%s\nux=%s\n' "$quality" "$backend_health" "$ux"
          test "$quality" = success
          test "$backend_health" = success -o "$backend_health" = skipped
          test "$ux" = success
