name: Firebase Preview Channels Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Автоудаление канала pr-<N> при закрытии PR (смержен или просто закрыт).
  delete-on-close:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Configure Firebase auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Delete PR preview channel
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CHANNEL: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          if firebase hosting:channel:list --project "$FIREBASE_PROJECT_ID" --json \
               | jq -e --arg c "$CHANNEL" '[.[]?.name] | any(. == $c or endswith("/" + $c))' >/dev/null; then
            firebase hosting:channel:delete "$CHANNEL" --project "$FIREBASE_PROJECT_ID" --force
            echo "Канал $CHANNEL удалён."
          else
            echo "Канал $CHANNEL не найден — удалять нечего. Job зелёный."
          fi

  # 2. Разовая чистка: вручную. Для каждого канала pr-<N> проверяет через GitHub API,
  #    открыт ли PR #N; закрытые/смержённые — удаляет. Канал live НИКОГДА не трогает.
  cleanup-closed:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Configure Firebase auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Delete channels of closed/merged PRs
        uses: actions/github-script@v7
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const projectId = process.env.FIREBASE_PROJECT_ID;

            const raw = execSync(
              `firebase hosting:channel:list --project ${projectId} --json`,
              { encoding: 'utf8' }
            );
            let channels;
            try {
              channels = JSON.parse(raw);
            } catch {
              core.setFailed('Не удалось разобрать вывод hosting:channel:list --json');
              return;
            }

            const prRe = /^pr-(\d+)$/;
            let deleted = 0;
            let skipped = 0;

            for (const ch of channels) {
              const lastSeg = String(ch.name).split('/').pop();

              // Канал live НИКОГДА не трогаем.
              if (lastSeg === 'live') {
                core.info('Канал live — пропущен (не трогаем).');
                skipped++;
                continue;
              }

              const m = lastSeg.match(prRe);
              if (!m) {
                core.info(`Канал ${lastSeg} не вида pr-<N> — пропущен.`);
                skipped++;
                continue;
              }

              const num = parseInt(m[1], 10);

              let pr;
              try {
                const res = await github.rest.pulls.get({ owner, repo, pull_number: num });
                pr = res.data;
              } catch (e) {
                core.warning(`PR #${num} не найден (status ${e.status}) — канал ${lastSeg} пропущен.`);
                skipped++;
                continue;
              }

              if (pr.state === 'open') {
                core.info(`PR #${num} открыт — канал ${lastSeg} не трогаем.`);
                skipped++;
                continue;
              }

              const reason = pr.merged ? 'смержен' : 'закрыт';
              core.info(`PR #${num} ${reason} — удаляем канал ${lastSeg}.`);
              try {
                execSync(
                  `firebase hosting:channel:delete ${lastSeg} --project ${projectId} --force`,
                  { encoding: 'utf8', stdio: 'inherit' }
                );
                deleted++;
              } catch (e) {
                core.warning(`Не удалось удалить канал ${lastSeg}: ${e.message}`);
              }
            }

            core.info(`Готово. Удалено: ${deleted}, пропущено: ${skipped}.`);
