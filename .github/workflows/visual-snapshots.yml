name: Visual snapshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-snapshots-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.1

jobs:
  update-baselines:
    name: Обновление эталонов
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Регенерация визуальных эталонов
        continue-on-error: true
        env:
          RUN_VISUAL_SNAPSHOTS: 'true'
          UX_FIXED_TIME: '08:00'
        run: npm run ux:check -- --update-snapshots

      - name: Коммит и пуш обновлённых эталонов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/ux/ux-check.spec.mjs-snapshots/
          if git diff --cached --quiet; then
            echo "Нет изменений эталонов — коммит не нужен"
          else
            git commit -m "chore: автообновление визуальных эталонов [skip ci]"
            git push
          fi

  visual-diff:
    name: Визуальные снапшоты (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Загрузить эталоны из main
        run: |
          git fetch origin main
          git checkout FETCH_HEAD -- tests/ux/ux-check.spec.mjs-snapshots/

      - name: Запуск визуальных снапшотов
        env:
          RUN_VISUAL_SNAPSHOTS: 'true'
          UX_FIXED_TIME: '08:00'
        run: npm run ux:check

      - name: Комментарий с визуальными отличиями
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/visual-diff-comment.sh

      - name: Загрузка артефактов
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-snapshots
          path: |
            artifacts/ux-check/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
