name: Автоматическая проверка Mentalix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Проверка кода и сборки
    runs-on: ubuntu-latest

    steps:
      - name: Получить код Mentalix
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить качество кода
        run: npm run lint

      - name: Собрать Mentalix
        run: npm run build
