name: Автоматическая проверка Mentalix

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Базовая проверка проекта
    runs-on: ubuntu-latest

    steps:
      - name: Получить код Mentalix
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить unit, lint, build и документацию
        run: npm run check:core

      - name: Проверить Render backend
        env:
          RENDER_BACKEND_URL: https://mentalix-bot.onrender.com
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$RENDER_BACKEND_URL/api/health")"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | jq -e '.status == "ok"' >/dev/null
